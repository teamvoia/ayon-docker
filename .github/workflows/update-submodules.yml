name: Update Submodules

on:
  repository_dispatch:
    types: [submodule-updated]
  workflow_dispatch:
  # schedule:
  #   - cron: '0 16 * * 1-5'

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout docker repo
        uses: actions/checkout@v4
        with:
          ref: voia
          token: ${{ secrets.PAT_TOKEN }}
          submodules: true
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Determine which submodule to update
        id: submodule
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            REPO="${{ github.event.client_payload.repo }}"
            if [[ "$REPO" == *"backend"* ]]; then
              echo "name=backend" >> $GITHUB_OUTPUT
              echo "update_all=false" >> $GITHUB_OUTPUT
            elif [[ "$REPO" == *"frontend"* ]]; then
              echo "name=frontend" >> $GITHUB_OUTPUT
              echo "update_all=false" >> $GITHUB_OUTPUT
            else
              echo "update_all=true" >> $GITHUB_OUTPUT
            fi
          else
            # For scheduled runs and manual triggers, update all
            echo "update_all=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Update specific submodule
        if: steps.submodule.outputs.update_all == 'false'
        run: |
          cd ${{ steps.submodule.outputs.name }}
          git fetch origin voia
          git checkout voia
          git pull origin voia
          cd ..
      
      - name: Update all submodules
        if: steps.submodule.outputs.update_all == 'true'
        run: |
          git submodule update --remote --merge
      
      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add backend frontend
          git commit -m "automated: update submodules to latest on voia branches"
          git push origin voia
      
      - name: Create summary
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "### Submodules Updated ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check which submodules actually changed
          CHANGED_FILES=$(git diff HEAD~1 --name-only)
          
          # Backend changes
          if echo "$CHANGED_FILES" | grep -q "^backend"; then
            echo "#### 🔧 Backend" >> $GITHUB_STEP_SUMMARY
            cd backend
            OLD_COMMIT=$(git rev-parse HEAD@{1} 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            NEW_COMMIT=$(git rev-parse HEAD)
            
            if [ "$OLD_COMMIT" != "$NEW_COMMIT" ]; then
              echo "**Commits:** [\`${OLD_COMMIT:0:7}\`](https://github.com/teamvoia/ayon-backend/commit/$OLD_COMMIT) → [\`${NEW_COMMIT:0:7}\`](https://github.com/teamvoia/ayon-backend/commit/$NEW_COMMIT)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              git log --pretty=format:"- %s (%an)" $OLD_COMMIT..$NEW_COMMIT 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "- Updated to latest commit" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            cd ..
          fi
          
          # Frontend changes
          if echo "$CHANGED_FILES" | grep -q "^frontend"; then
            echo "#### 🎨 Frontend" >> $GITHUB_STEP_SUMMARY
            cd frontend
            OLD_COMMIT=$(git rev-parse HEAD@{1} 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            NEW_COMMIT=$(git rev-parse HEAD)
            
            if [ "$OLD_COMMIT" != "$NEW_COMMIT" ]; then
              echo "**Commits:** [\`${OLD_COMMIT:0:7}\`](https://github.com/teamvoia/ayon-frontend/commit/$OLD_COMMIT) → [\`${NEW_COMMIT:0:7}\`](https://github.com/teamvoia/ayon-frontend/commit/$NEW_COMMIT)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              git log --pretty=format:"- %s (%an)" $OLD_COMMIT..$NEW_COMMIT 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "- Updated to latest commit" >> $GITHUB_STEP_SUMMARY
            fi
            cd ..
          fi
      
      - name: No changes summary
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "### ℹ️ Submodules already up to date" >> $GITHUB_STEP_SUMMARY