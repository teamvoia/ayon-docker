name: Update Submodules

on:
  repository_dispatch:
    types: [submodule-updated]
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 1-5'

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout docker repo
        uses: actions/checkout@v4
        with:
          ref: voia
          token: ${{ secrets.PAT_TOKEN }}
          submodules: true
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Update submodules to latest voia
        run: |
          git submodule update --remote --merge
      
      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add backend frontend
          git commit -m "automated: update submodules to latest on voia branches"
          git push origin voia
      
      - name: Create summary
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "### Submodules Updated ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Backend changes
          echo "#### 🔧 Backend" >> $GITHUB_STEP_SUMMARY
          cd backend
          OLD_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          NEW_COMMIT=$(git rev-parse HEAD)
          
          if [ "$OLD_COMMIT" != "$NEW_COMMIT" ]; then
            echo "**Commits:** [\`${OLD_COMMIT:0:7}\`](https://github.com/teamvoia/ayon-backend/commit/$OLD_COMMIT) → [\`${NEW_COMMIT:0:7}\`](https://github.com/teamvoia/ayon-backend/commit/$NEW_COMMIT)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            git log --pretty=format:"- %s (%an)" $OLD_COMMIT..$NEW_COMMIT >> $GITHUB_STEP_SUMMARY
          else
            echo "_No changes_" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          cd ..
          
          # Frontend changes
          echo "#### 🎨 Frontend" >> $GITHUB_STEP_SUMMARY
          cd frontend
          OLD_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          NEW_COMMIT=$(git rev-parse HEAD)
          
          if [ "$OLD_COMMIT" != "$NEW_COMMIT" ]; then
            echo "**Commits:** [\`${OLD_COMMIT:0:7}\`](https://github.com/teamvoia/ayon-frontend/commit/$OLD_COMMIT) → [\`${NEW_COMMIT:0:7}\`](https://github.com/teamvoia/ayon-frontend/commit/$NEW_COMMIT)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            git log --pretty=format:"- %s (%an)" $OLD_COMMIT..$NEW_COMMIT >> $GITHUB_STEP_SUMMARY
          else
            echo "_No changes_" >> $GITHUB_STEP_SUMMARY
          fi
          cd ..
      
      - name: No changes summary
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "### ℹ️ Submodules already up to date" >> $GITHUB_STEP_SUMMARY